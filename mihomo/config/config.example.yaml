mixed-port: 7899
allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
secret: "Duoduo0210."

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - nextcloud-aio-apache
    - nextcloud-aio-database
    - nextcloud-aio-nextcloud
    - nextcloud-aio-redis
    - nextcloud-aio-notify-push
    - nextcloud-aio-talk
    - nextcloud-aio-imaginary
    - nextcloud-aio-whiteboard
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true

listeners:
  - name: port_auto
    type: mixed
    port: 7891
    listen: 0.0.0.0
    rule: auto-in

proxy-providers:
  sub-1:
    type: http
    url: "第一个链接"
    interval: 86400
    path: ./providers/sub-1.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204

  sub-2:
    type: http
    url: "第二个链接"
    interval: 86400
    path: ./providers/sub-2.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT
    use:
      - sub-1
      - sub-2

  - name: AUTO
    type: url-test
    use:
      - sub-1
      - sub-2
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

sub-rules:
  auto-in:
    # ================= 1. Steam 下载 CDN（直连） =================
    # 优先匹配下载与更新域名，直接走本地宽带
    - DOMAIN-SUFFIX,steamcontent.com,DIRECT
    - DOMAIN-SUFFIX,steamstatic.com,DIRECT
    - DOMAIN-SUFFIX,steamuserimages-a.akamaihd.net,DIRECT
    - DOMAIN-KEYWORD,steam-chat,DIRECT
    - DOMAIN-KEYWORD,steamcontent,DIRECT

    # ================= 2. Steam 商店/社区/API（代理） =================
    # 商店浏览、社区访问、客服与 API 登录
    - DOMAIN-SUFFIX,steampowered.com,PROXY
    - DOMAIN-SUFFIX,steamcommunity.com,PROXY
    - DOMAIN-SUFFIX,steamgames.com,PROXY
    - DOMAIN-SUFFIX,steamserver.net,PROXY
    - DOMAIN-SUFFIX,steamstat.us,PROXY
    - DOMAIN-KEYWORD,steampowered,PROXY

    # ================= 3. 基础/兜底规则 =================
    - GEOIP,CN,DIRECT
    - MATCH,PROXY

rules:
  # GEOIP DOWNLOAD PATH https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
